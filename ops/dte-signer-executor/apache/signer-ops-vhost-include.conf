# FISCAL-ONBOARDING — include del vhost SSL del subdominio de operaciones
# (p.ej. signer-ops.getzolvi.com). El ejecutor escucha solo en 127.0.0.1:9750
# y autentica cada request con HMAC; esta capa añade TLS y filtro de IP.
ProxyRequests Off
ProxyPass "/.well-known/" "!"
ProxyPass "/v1/execute" "http://127.0.0.1:9750/v1/execute" connectiontimeout=5 timeout=240
ProxyPassReverse "/v1/execute" "http://127.0.0.1:9750/v1/execute"
<Location "/v1/execute">
  # Reemplazar por las IP de salida de Zolvi cuando estén fijas.
  Require all granted
</Location>
<Location "/.well-known/">
  Require all granted
</Location>
